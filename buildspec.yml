version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm install
      - npm ci
      - npx cypress install
  pre_build:
    commands:
      - echo Starting the frontend app...
      - npm run start &                  
      - npx wait-on http://localhost:3000 
  build:
    commands:
      - nohup npm start & 
      - sleep 15
      - npx cypress run
